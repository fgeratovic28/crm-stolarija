<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Noto+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        try {
          var k = "crm-ui-theme";
          var t = localStorage.getItem(k);
          var dark = t === "dark";
          document.documentElement.classList.toggle("dark", dark);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", dark ? "#0c1119" : "#0B2147");
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#0B2147" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/pwa-icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />
    <title>Termo Plast CRM</title>
    <meta name="description" content="CRM sistem za upravljanje poslovima u stolariji" />
    <meta name="author" content="Filip Geratović" />

    <meta property="og:title" content="Termo Plast CRM" />
    <meta property="og:description" content="CRM sistem za upravljanje poslovima u stolariji" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-icon-512.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@filipgeratovic" />
    <meta name="twitter:image" content="/pwa-icon-512.png" />
    <style>
      html,
      body,
      #root {
        height: 100%;
        min-height: 100%;
      }

      html,
      body {
        margin: 0;
      }

      html:not(.dark) body {
        background: hsl(220 26% 97%);
        color: hsl(218 44% 15%);
      }

      html.dark body {
        background: hsl(222 22% 8%);
        color: hsl(210 18% 94%);
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
